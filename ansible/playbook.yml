---
# =============================================================
# Server Patch Tracking Dashboard — Ansible Deployment Playbook
# =============================================================
# Deploys (or re-deploys) the application using Docker Compose.
# Designed for local execution:
#   ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
#
# Idempotent: running twice produces no unnecessary changes
# when containers are already in the desired state.
# =============================================================

- name: Deploy Server Patch Tracking Dashboard
  hosts: local
  gather_facts: false
  vars:
    project_dir: "{{ playbook_dir | dirname }}"

  tasks:
    # ----------------------------------------------------------
    # 1. Verify Docker is available
    # ----------------------------------------------------------
    - name: Check Docker is installed and reachable
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Print Docker version
      debug:
        msg: "{{ docker_version.stdout }}"

    # ----------------------------------------------------------
    # 2. Build / pull images and start containers
    # ----------------------------------------------------------
    - name: Start application with docker compose
      command: docker compose up -d --build
      args:
        chdir: "{{ project_dir }}"
      register: compose_up

    - name: Show docker compose output
      debug:
        msg: "{{ compose_up.stdout_lines }}"

    # ----------------------------------------------------------
    # 3. Wait for backend to become healthy
    # ----------------------------------------------------------
    - name: Wait for backend API to respond
      uri:
        url: "http://localhost:8080/api/dashboard/summary"
        method: GET
        status_code: 200
      register: health
      retries: 20
      delay: 5
      until: health.status == 200

    - name: Print health-check result
      debug:
        msg: "Backend is healthy — HTTP {{ health.status }}"
