version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: patch_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: server_patch_dashboard
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: patch_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=server_patch_dashboard
      - DB_USERNAME=root
      - DB_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: patch_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
